<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>文明中国 · 用真实数据绘制的策略游戏地图</title>
  <meta name="description" content="把真实的中国画成一张回合制 4X 策略游戏地图：六边形地形、城市产出、地块改良、资源与奇观，全部来自公开数据。">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23120d06'/%3E%3Ccircle cx='32' cy='32' r='29' fill='%23c9a45c'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23a3271c'/%3E%3Cpath fill='%23f8e08a' d='M32 14l4.9 11.3 12.2 1.1-9.3 8.1 2.8 12-10.6-6.4-10.6 6.4 2.8-12-9.3-8.1 12.2-1.1z'/%3E%3C/svg%3E">
  <!-- 社交卡片：爬虫需要绝对地址。本地运行时保持占位地址即可；若部署到自己的网址，请把 SITE_URL 占位
       （http://127.0.0.1:8765/）替换为实际地址（og:url、og:image、twitter:image、canonical，以及
       js/app/share.js）。og-image.png 为 1200×630 的首页截图。 -->
  <link rel="canonical" href="http://127.0.0.1:8765/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="文明中国 chinaciv">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="文明中国：策略游戏风格的中国地图">
  <meta property="og:description" content="用公开数据把真实的中国经济画成 4X 策略游戏地图：六边形地形、城市产出、铁路与港口、资源与奇观（国家统计局、交通运输部、民航局、UNESCO 等）。本地图仅供个人学习，未申请审图号。">
  <meta property="og:url" content="http://127.0.0.1:8765/">
  <meta property="og:image" content="http://127.0.0.1:8765/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="文明中国：策略游戏风格的中国地图">
  <meta name="twitter:description" content="用公开数据把真实的中国经济画成 4X 策略游戏地图。">

  <!-- 中文衬线字体：Google Fonts 的思源宋体（Noto Serif SC）。以 media="print" 方式异步加载，离线或无法访问时
       不阻塞页面，自动退回系统宋体（Songti SC / 宋体）。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&amp;display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/advisors.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="中华人民共和国"><span class="brand-emblem" aria-hidden="true">★</span><span class="brand-text">文明中国</span></div>
    <div id="yields" class="yields" aria-label="全国产出"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" placeholder="搜索城市、省份" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="搜索城市和省份（/ 或 Ctrl K）">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="分享当前视图" title="分享：复制链接或下载图片"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="键盘与鼠标帮助" title="帮助（?）"></button>
      <button id="btn-pedia" class="btn" aria-label="打开百科" title="每个数字的含义与出处"></button>
    </div>
  </header>

  <canvas id="map" role="img" aria-label="中国六边形地图"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="详情"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="选择透镜"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="透镜图例"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="地图透镜">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="地块上的资源（R）" title="显示或隐藏地块上的资源（R）" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="小地图：点击跳转" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="显示小地图"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="搜索结果" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="分享" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="全国报告" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="百科">
      <button class="close icon-btn" data-close aria-label="关闭百科">✕</button>
      <nav id="pedia-nav" aria-label="百科目录"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">正在勘测山川……</div>
  <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
